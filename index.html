<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07080b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>NES</title>
  <style>
    :root{color-scheme:dark;--case:#bdbdb8;--case-edge:#e6e5df;--pad:#222427;--red:#bb1739;--pad-size:clamp(38px,11.3vw,55px);--action-size:clamp(49px,14.5vw,66px)}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#07080b}
    body{font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
    button{font-family:inherit;cursor:pointer}
    button:focus-visible{outline:3px solid #f2cb61;outline-offset:4px}
    #console{width:100vw;height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden;background:radial-gradient(ellipse at center,#191a1f 0%,#050607 80%)}
    .display-area{min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(4px,1.2vmin,14px);overflow:hidden;touch-action:manipulation}
    .screen-frame{position:relative;width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;border-radius:clamp(3px,1vmin,12px);box-shadow:0 0 0 2px #1f2023,0 8px 38px #000b}
    canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
    .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;pointer-events:none}
    .loading[hidden]{display:none!important}
    .loader{width:29px;height:29px;border:3px solid #32343a;border-top-color:#a0a0a0;border-radius:100%;animation:turn .9s linear infinite}
    @keyframes turn{to{transform:rotate(360deg)}}
    .error{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:18px;background:#090a0b;color:#f9eded;gap:12px;pointer-events:auto}
    .error[hidden]{display:none!important}
    .error span{font-size:14px;line-height:1.5;max-width:340px}
    .retry{margin:0 auto;border:1px solid #777;border-radius:8px;background:#333;color:white;padding:10px 16px;font-size:13px}
    .controller{position:relative;width:min(100%,840px);margin:0 auto;padding:clamp(15px,2.6vmin,24px) clamp(10px,2.5vmin,24px);padding-bottom:max(clamp(15px,2.6vmin,24px),env(safe-area-inset-bottom));background:linear-gradient(165deg,#d8d8d2 0%,var(--case) 58%,#949590 100%);border:5px solid #a4a5a0;border-top-color:var(--case-edge);border-left-color:var(--case-edge);border-radius:19px 19px 25px 25px;box-shadow:inset 0 3px 5px #ffffff75,inset 0 -5px 6px #0002,0 9px 24px #0009;touch-action:none}
    .controller::before{content:'';position:absolute;inset:9px 10px auto;height:4px;background:#a1a39e99;border-radius:5px;pointer-events:none}
    .controller-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(64px,.55fr) minmax(0,1fr);align-items:end;justify-items:center;gap:clamp(3px,2vw,25px);min-height:calc(var(--pad-size)*3 + 2px)}
    .dpad{position:relative;width:calc(var(--pad-size)*3);height:calc(var(--pad-size)*3);touch-action:none;isolation:isolate;cursor:pointer;flex-shrink:0}
    .dpad::before,.dpad::after{content:'';position:absolute;background:linear-gradient(160deg,#313336,#111214);border:2px solid #44464a;box-shadow:inset 0 1px 0 #717275a0,0 4px 3px #0005;z-index:-1}
    .dpad::before{top:33.333%;left:0;width:100%;height:33.333%;border-radius:7px}
    .dpad::after{left:33.333%;top:0;width:33.333%;height:100%;border-radius:7px}
    .dpad-center{position:absolute;left:calc(50% - var(--pad-size)*.32);top:calc(50% - var(--pad-size)*.32);width:calc(var(--pad-size)*.64);height:calc(var(--pad-size)*.64);border:1px solid #333;box-shadow:inset 1px 1px 2px #0008,0 1px 0 #ffffff16;border-radius:50%;background:#242628;pointer-events:none}
    .dir{position:absolute;width:var(--pad-size);height:var(--pad-size);background:transparent;color:#4c4e50;border:0;display:grid;place-items:center;padding:0;touch-action:none;outline-offset:0}
    .dir::after{content:'';width:0;height:0;border:4px solid transparent;filter:drop-shadow(0 1px 0 #0008)}
    .dir[data-btn="UP"]{left:33.333%;top:0}.dir[data-btn="UP"]::after{border-bottom-color:#595b5d;transform:translateY(-2px)}
    .dir[data-btn="DOWN"]{left:33.333%;bottom:0}.dir[data-btn="DOWN"]::after{border-top-color:#595b5d;transform:translateY(2px)}
    .dir[data-btn="LEFT"]{left:0;top:33.333%}.dir[data-btn="LEFT"]::after{border-right-color:#595b5d;transform:translateX(-2px)}
    .dir[data-btn="RIGHT"]{right:0;top:33.333%}.dir[data-btn="RIGHT"]::after{border-left-color:#595b5d;transform:translateX(2px)}
    .dpad.held::before,.dpad.held::after{filter:brightness(1.14)}
    .system{height:calc(var(--pad-size)*3);align-self:stretch;display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,.9vw,14px);padding-bottom:clamp(10px,1.2vmin,22px)}
    .system-key{width:clamp(34px,6vw,58px);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:9px;touch-action:none}
    .system-key button{width:100%;height:17px;background:linear-gradient(#414143,#151618);border:2px solid #5b5c5a;border-radius:50px;box-shadow:inset 0 2px 3px #090909b0,0 2px 0 #e4e3de;touch-action:none}
    .system-key button.pressed{background:linear-gradient(#171718,#434347);transform:translateY(1px)}
    .system-key label{color:#6d2d3c;font-family:Arial, sans-serif;font-size:clamp(8px,1vw,11px);font-weight:800;letter-spacing:-.2px;white-space:nowrap;pointer-events:none}
    .action-pad{position:relative;height:calc(var(--pad-size)*3);width:min(100%,200px);display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,26px);padding-top:22px}
    .action-well{display:grid;place-items:center;padding:5px;background:#888a89;border-radius:100%;box-shadow:inset 0 2px 4px #0006,0 1px 0 #fff6}
    .action-button{width:var(--action-size);height:var(--action-size);padding:0;border-radius:50%;border:2px solid #8b0a2c;background:radial-gradient(circle at 28% 21%,#ea4560 0%,var(--red) 42%,#830d2a 93%);box-shadow:inset 0 2px 2px #ff799664,inset 0 -3px 4px #5d061b,0 4px 2px #0005;color:#ffe8ea;font-size:clamp(15px,3.5vw,23px);font-weight:900;touch-action:none}
    .action-button.pressed,.action-button:active{transform:translateY(3px);box-shadow:inset 0 3px 6px #510716,0 1px 1px #0005;filter:brightness(.95)}
    .action-well:first-child{transform:translateY(11px)}.action-well:last-child{transform:translateY(-10px)}
    @media(orientation:portrait) and (max-width:650px){
      #console{grid-template-rows:minmax(0,1fr) auto}
      .controller{border-radius:19px 19px 0 0;border-bottom:0;width:100%;min-height:clamp(190px,31dvh,320px);display:flex;align-items:center;justify-content:center}
      .controller-inner{width:100%}
      .display-area{padding:5px 5px 10px}
    }
    @media(orientation:landscape) and (max-height:570px){
      :root{--pad-size:clamp(35px,9vh,49px);--action-size:clamp(43px,11vh,63px)}
      #console{grid-template-columns:minmax(0,1fr) minmax(290px,43%);grid-template-rows:1fr}
      .display-area{padding:5px}
      .controller{width:100%;height:100%;margin:0;display:flex;align-items:center;justify-content:center;border-radius:18px 0 0 18px;border-top-width:5px;padding:9px;min-width:0}
      .controller-inner{width:100%;grid-template-columns:minmax(0,1fr) minmax(56px,.55fr) minmax(0,1fr);gap:3px}
      .system-key{gap:7px}.system-key button{height:14px}.system-key label{font-size:8px}
      .action-pad{gap:4px}.action-well{padding:3px}
    }
    @media(orientation:landscape) and (min-height:571px){
      #console{grid-template-rows:minmax(0,1fr) auto}
      .controller{height:clamp(185px,30dvh,246px)}
      .controller-inner{height:100%}
    }
    @media(max-width:345px){
      :root{--pad-size:36px;--action-size:46px}
      .controller{padding-left:7px;padding-right:7px}.controller-inner{gap:2px}.system-key{width:33px}.system-key button{width:34px}
      .action-pad{gap:2px}
    }
    @media(prefers-reduced-motion:reduce){.loader{animation:none}}
  </style>
</head>
<body>
<main id="console" aria-label="Emulador de NES">
  <section class="display-area" aria-label="Tela do jogo">
    <div class="screen-frame" id="screenFrame">
      <canvas id="screen" width="256" height="240" aria-label="Jogo NES em execução"></canvas>
      <div class="loading" id="loading" role="status" aria-label="Carregando jogo"><div class="loader"></div></div>
      <div class="error" id="error" role="alert" hidden><span id="errorText">Não foi possível carregar o jogo.</span><button class="retry" id="retry" type="button">Tentar novamente</button></div>
    </div>
  </section>
  <section class="controller" aria-label="Controle NES">
    <div class="controller-inner">
      <div class="dpad" id="dpad" aria-label="Direcional">
        <button type="button" class="dir" data-btn="UP" aria-label="Cima"></button>
        <button type="button" class="dir" data-btn="LEFT" aria-label="Esquerda"></button>
        <button type="button" class="dir" data-btn="RIGHT" aria-label="Direita"></button>
        <button type="button" class="dir" data-btn="DOWN" aria-label="Baixo"></button>
        <div class="dpad-center" aria-hidden="true"></div>
      </div>
      <div class="system">
        <div class="system-key"><button type="button" data-btn="SELECT" aria-label="Select"></button><label>SELECT</label></div>
        <div class="system-key"><button type="button" data-btn="START" aria-label="Start"></button><label>START</label></div>
      </div>
      <div class="action-pad">
        <div class="action-well"><button type="button" class="action-button" data-btn="B" aria-label="Botão B">B</button></div>
        <div class="action-well"><button type="button" class="action-button" data-btn="A" aria-label="Botão A">A</button></div>
      </div>
    </div>
  </section>
</main>
<script>
'use strict';
const canvas=document.querySelector('#screen');
const ctx=canvas.getContext('2d',{alpha:false});
const rgba=ctx.createImageData(256,240);
const loading=document.querySelector('#loading');
const error=document.querySelector('#error');
const errorText=document.querySelector('#errorText');
const pad=document.querySelector('#dpad');
let nes=null, frames=0, lastTick=0, elapsed=0, gameActive=false;
// Audio v5: usa Web Audio e os samples reais da APU do NES (JSNES).
const pressed=new Map();
function showError(message){loading.hidden=true;errorText.textContent=message;error.hidden=false;console.error('[NES]',message)}
function showLoaded(){loading.hidden=true;error.hidden=true;gameActive=true}
function loadScript(url){return new Promise((resolve,reject)=>{
  const el=document.createElement('script');el.src=url;el.async=true;
  const timer=setTimeout(()=>{el.remove();reject(Error('Tempo esgotado'))},14000);
  el.onload=()=>{clearTimeout(timer);resolve()};el.onerror=()=>{clearTimeout(timer);reject(Error('Não foi possível baixar o emulador'))};document.head.appendChild(el);
})}
async function ensureJSNES(){
  if(window.jsnes?.NES)return;
  const cdns=[
    'https://cdn.jsdelivr.net/npm/jsnes@2.1.0/dist/jsnes.min.js',
    'https://unpkg.com/jsnes@2.1.0/dist/jsnes.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jsnes/2.1.0/jsnes.min.js'
  ];
  for(const url of cdns){try{await loadScript(url);if(window.jsnes?.NES)return}catch(e){console.warn('[NES]',url,e)}}
  throw Error('Não foi possível carregar o emulador. Confira sua conexão com a internet.');
}
// ===== NES AUDIO (Web Audio API) ============================================
// O JSNES gera audio atraves de onAudioSample; o navegador reproduz os samples.
// AudioWorklet evita estalos quando o desenho do jogo ocupa a thread principal.
// ScriptProcessor fica como compatibilidade para navegadores mais antigos.
let audioContext=null, audioNode=null, audioMode='off';
let audioVolume=0.80, audioGestureSeen=false;
const audioRingSize=32768;
const audioLeft=new Float32Array(audioRingSize);
const audioRight=new Float32Array(audioRingSize);
let audioRead=0, audioWrite=0, audioCount=0, audioReady=false;
let chunk=new Float32Array(4096), chunkSamples=0;

const processorCode=`
class RetroNesSound extends AudioWorkletProcessor {
  constructor(){
    super();
    this.limit=32768;
    this.left=new Float32Array(this.limit);
    this.right=new Float32Array(this.limit);
    this.read=0;this.write=0;this.count=0;this.ready=false;
    this.maxSamples=Math.round(sampleRate*0.14);
    this.minSamples=Math.min(1024,Math.round(sampleRate*0.025));
    this.port.onmessage=(event)=>{
      const data=event.data;
      if(data.type==='clear'){
        this.read=0;this.write=0;this.count=0;this.ready=false;
        return;
      }
      if(data.type!=='pcm')return;
      const pcm=data.pcm;
      for(let i=0;i<pcm.length;i+=2){
        if(this.count>=this.maxSamples){this.read=(this.read+1)%this.limit;this.count--;}
        this.left[this.write]=pcm[i];
        this.right[this.write]=pcm[i+1];
        this.write=(this.write+1)%this.limit;
        this.count++;
      }
    };
  }
  process(inputs,outputs){
    const out=outputs[0];if(!out)return true;
    const l=out[0], r=out[1]||out[0];
    if(!this.ready&&this.count>=this.minSamples)this.ready=true;
    for(let i=0;i<l.length;i++){
      if(this.ready&&this.count){
        l[i]=this.left[this.read];r[i]=this.right[this.read];
        this.read=(this.read+1)%this.limit;this.count--;
      } else {l[i]=0;r[i]=0;}
      if(!this.count)this.ready=false;
    }
    return true;
  }
}
registerProcessor('retro-nes-sound',RetroNesSound);
`;

function clearAudioQueue(){
  audioRead=audioWrite=audioCount=0;audioReady=false;chunkSamples=0;
  if(audioMode==='worklet')audioNode.port.postMessage({type:'clear'});
}
async function prepareAudio(){
  const AudioContextType=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextType){console.warn('[NES] AudioContext não disponível.');return;}
  try{
    audioContext=new AudioContextType({latencyHint:'interactive'});
    if(audioContext.audioWorklet&&window.AudioWorkletNode){
      const blob=new Blob([processorCode],{type:'text/javascript'});
      const url=URL.createObjectURL(blob);
      try{
        await audioContext.audioWorklet.addModule(url);
        audioNode=new AudioWorkletNode(audioContext,'retro-nes-sound',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
        audioNode.connect(audioContext.destination);
        audioMode='worklet';
      }catch(e){console.warn('[NES] AudioWorklet indisponível; usando compatibilidade.',e)}
      finally{URL.revokeObjectURL(url)}
    }
    if(!audioNode&&audioContext.createScriptProcessor){
      audioNode=audioContext.createScriptProcessor(1024,0,2);
      audioNode.onaudioprocess=event=>{
        const l=event.outputBuffer.getChannelData(0);
        const r=event.outputBuffer.getChannelData(1);
        if(!audioReady&&audioCount>=1024)audioReady=true;
        for(let i=0;i<l.length;i++){
          if(audioReady&&audioCount){
            l[i]=audioLeft[audioRead];r[i]=audioRight[audioRead];
            audioRead=(audioRead+1)%audioRingSize;audioCount--;
          }else{l[i]=0;r[i]=0;}
          if(!audioCount)audioReady=false;
        }
      };
      audioNode.connect(audioContext.destination);
      audioMode='script';
    }
    if(!audioNode){console.warn('[NES] Saída de áudio indisponível.');audioMode='off';}
    if(audioGestureSeen)resumeAudio();
  }catch(e){console.warn('[NES] Falha ao preparar o áudio.',e);audioMode='off';}
}
function resumeAudio(){
  audioGestureSeen=true;
  if(!audioContext||!audioNode)return;
  if(audioContext.state!=='running'){
    clearAudioQueue();
    audioContext.resume().catch(e=>console.warn('[NES] O navegador não liberou o áudio.',e));
  }
}
// Chamadas em um gesto real; Chrome/Safari bloqueiam áudio automático.
document.addEventListener('pointerdown',resumeAudio,{capture:true,passive:true});
document.addEventListener('keydown',resumeAudio,{capture:true});
document.addEventListener('touchstart',resumeAudio,{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{
  if(!audioContext)return;
  if(document.hidden){clearAudioQueue();audioContext.suspend().catch(()=>{});}
  // Ao voltar, o som é liberado novamente ao tocar em um botão.
});
function onAudioSample(left,right){
  if(!audioContext||audioContext.state!=='running'||audioMode==='off')return;
  const l=Math.max(-1,Math.min(1,left))*audioVolume;
  const r=Math.max(-1,Math.min(1,right))*audioVolume;
  if(audioMode==='worklet'){
    if(chunkSamples*2>=chunk.length)flushAudio();
    chunk[chunkSamples*2]=l;chunk[chunkSamples*2+1]=r;chunkSamples++;
  }else{
    const maxSamples=Math.round(audioContext.sampleRate*0.14);
    if(audioCount>=maxSamples){audioRead=(audioRead+1)%audioRingSize;audioCount--;}
    audioLeft[audioWrite]=l;audioRight[audioWrite]=r;
    audioWrite=(audioWrite+1)%audioRingSize;audioCount++;
  }
}
function flushAudio(){
  if(audioMode==='worklet'&&audioNode&&chunkSamples){
    const pcm=chunk.slice(0,chunkSamples*2);
    audioNode.port.postMessage({type:'pcm',pcm},[pcm.buffer]);
    chunkSamples=0;
  }
}
// ============================================================================

function renderFrame(buffer){
  const d=rgba.data;
  for(let i=0,j=0;i<buffer.length;i++,j+=4){const p=buffer[i];d[j]=p&255;d[j+1]=p>>>8&255;d[j+2]=p>>>16&255;d[j+3]=255}
  ctx.putImageData(rgba,0,0);frames++;
  if(frames===3)showLoaded();
}
function keyState(name,source,down){
  if(!nes||!window.jsnes?.Controller)return;
  const b=window.jsnes.Controller['BUTTON_'+name];if(b===undefined)return;
  let holders=pressed.get(name);if(!holders){holders=new Set();pressed.set(name,holders)}
  const was=holders.size>0;
  if(down)holders.add(source);else holders.delete(source);
  if(!was&&holders.size)nes.buttonDown(1,b);
  if(was&&!holders.size)nes.buttonUp(1,b);
  for(const el of document.querySelectorAll(`[data-btn="${name}"]`))el.classList.toggle('pressed',holders.size>0);
}
const keymap={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',KeyX:'A',KeyZ:'B',Enter:'START',ShiftRight:'SELECT',KeyK:'B',KeyL:'A'};
document.addEventListener('keydown',e=>{const name=keymap[e.code];if(name){e.preventDefault();keyState(name,'keyboard',true)}});
document.addEventListener('keyup',e=>{const name=keymap[e.code];if(name){e.preventDefault();keyState(name,'keyboard',false)}});
window.addEventListener('blur',()=>{for(const name of new Set(Object.values(keymap)))keyState(name,'keyboard',false);for(const name of ['UP','DOWN','LEFT','RIGHT','A','B','START','SELECT'])keyState(name,'touch',false)});
function immersive(){
  if(document.fullscreenElement||window.matchMedia('(display-mode: fullscreen)').matches||window.matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;
  if(!document.documentElement.requestFullscreen)return;
  try{const p=document.documentElement.requestFullscreen({navigationUI:'hide'});if(p?.catch)p.catch(()=>{})}catch(e){}
}
// The D-pad handles continuous movement, including sliding to a different direction and diagonals.
function dpadMove(ev,source){
  const box=pad.getBoundingClientRect();const x=(ev.clientX-box.left)/box.width-.5,y=(ev.clientY-box.top)/box.height-.5;
  const next={UP:y<-.20,DOWN:y>.20,LEFT:x<-.20,RIGHT:x>.20};
  if(Math.abs(x)<.14&&Math.abs(y)<.14)Object.keys(next).forEach(k=>next[k]=false);
  for(const name of Object.keys(next))keyState(name,source,next[name]);
  pad.classList.toggle('held',Object.values(next).some(Boolean));
}
const padPointers=new Set();
pad.addEventListener('pointerdown',e=>{
  e.preventDefault();if(e.pointerType!=='mouse')immersive();
  const source='dpad:'+e.pointerId;padPointers.add(source);
  try{pad.setPointerCapture(e.pointerId)}catch(e){}
  dpadMove(e,source);
});
pad.addEventListener('pointermove',e=>{const source='dpad:'+e.pointerId;if(padPointers.has(source)){e.preventDefault();dpadMove(e,source)}});
function releasePad(e){const source='dpad:'+e.pointerId;if(!padPointers.has(source))return;padPointers.delete(source);for(const name of ['UP','DOWN','LEFT','RIGHT'])keyState(name,source,false);if(!padPointers.size)pad.classList.remove('held')}
for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,releasePad);
// Keep the A/B and Start/Select buttons responsive to multi-touch.
for(const el of document.querySelectorAll('button[data-btn]:not(.dir)')){
  const name=el.dataset.btn;
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType!=='mouse')immersive();try{el.setPointerCapture(e.pointerId)}catch{}keyState(name,'pointer:'+e.pointerId,true)});
  for(const type of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(type,e=>keyState(name,'pointer:'+e.pointerId,false));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
let gamepadStates={};function pollGamepad(){
  if(!nes||!navigator.getGamepads)return;
  const gp=Array.from(navigator.getGamepads()||[]).find(Boolean),next={};
  if(gp){const b=i=>Boolean(gp.buttons[i]?.pressed);const x=gp.axes[0]||0,y=gp.axes[1]||0;
    Object.assign(next,{UP:b(12)||y<-.5,DOWN:b(13)||y>.5,LEFT:b(14)||x<-.5,RIGHT:b(15)||x>.5,A:b(0),B:b(1),START:b(9),SELECT:b(8)});
  }
  for(const k of ['UP','DOWN','LEFT','RIGHT','A','B','START','SELECT']){if(!!next[k]!==!!gamepadStates[k])keyState(k,'gamepad',!!next[k])}
  gamepadStates=next;
}
function tick(t){if(!nes)return;pollGamepad();if(!lastTick)lastTick=t;
  elapsed+=Math.min(70,t-lastTick);lastTick=t;let n=0;
  while(elapsed>=1000/60&&n<3){try{nes.frame();flushAudio()}catch(e){nes=null;showError('O jogo parou de executar.');return}elapsed-=1000/60;n++}
  if(n===3&&elapsed>150)elapsed=0;
  requestAnimationFrame(tick);
}
// Cada TAG NFC pode usar um jogo diferente: ?jogo=001, ?jogo=002, ...
// Também é possível abrir qualquer arquivo em jogos/ pelo nome: ?jogo=meu-jogo
// O emulador e os controles continuam compartilhados por todos os cartuchos.
async function escolherJogo(){
  const id=new URLSearchParams(location.search).get('jogo')||'001';
  if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,63}(?:\.nes)?$/.test(id)){
    throw Error('Código do cartucho inválido. Use letras, números, hífen ou sublinhado.');
  }
  let catalogo;
  try{
    const resposta=await fetch('./jogos/catalogo.json',{cache:'no-store'});
    if(!resposta.ok)throw Error('HTTP '+resposta.status);
    catalogo=await resposta.json();
  }catch(e){
    throw Error('Não foi possível abrir jogos/catalogo.json. Confira se enviou o arquivo para o GitHub.');
  }
  if(!catalogo||typeof catalogo!=='object'||Array.isArray(catalogo)){
    throw Error('O arquivo catalogo.json precisa conter um objeto de jogos.');
  }
  const ficha=Object.prototype.hasOwnProperty.call(catalogo,id)?catalogo[id]:null;
  if(!ficha&&/^\d+$/.test(id)){
    throw Error('Cartucho '+id+' não cadastrado em jogos/catalogo.json.');
  }
  // Nome direto dispensa editar o catálogo; basta enviar jogos/nome-do-jogo.nes.
  const arquivo=ficha?.arquivo||(id.toLowerCase().endsWith('.nes')?id:id+'.nes');
  if(typeof arquivo!=='string'||!/^[A-Za-z0-9][A-Za-z0-9_-]{0,63}\.nes$/i.test(arquivo)){
    throw Error('Nome de ROM inválido para o cartucho '+id+'. Renomeie o arquivo sem espaços.');
  }
  return {id,arquivo,nome:typeof ficha?.nome==='string'?ficha.nome:id};
}
async function boot(){
  try{
    const jogo=await escolherJogo();
    document.title=jogo.nome+' · NES';
    const caminho='./jogos/'+jogo.arquivo;
    const rom=await fetch(caminho,{cache:'no-store'});
    if(!rom.ok){
      if(rom.status===404)throw Error('ROM não encontrada: '+caminho+'. Confira o nome do arquivo em jogos/.');
      throw Error('Não foi possível baixar a ROM (HTTP '+rom.status+').');
    }
    const buffer=new Uint8Array(await rom.arrayBuffer());
    if(buffer.length<16||String.fromCharCode(...buffer.subarray(0,4))!=='NES\x1a'){
      throw Error('O arquivo '+jogo.arquivo+' não é uma ROM NES válida.');
    }
    await ensureJSNES();
    let binary='';for(let i=0;i<buffer.length;i+=8192)binary+=String.fromCharCode(...buffer.subarray(i,i+8192));
    await prepareAudio();
    nes=new window.jsnes.NES({onFrame:renderFrame,onAudioSample,emulateSound:audioMode!=='off',sampleRate:audioContext?.sampleRate||48000});
    nes.loadROM(binary);requestAnimationFrame(tick);
    setTimeout(()=>{if(!gameActive&&nes){showError('O jogo não produziu imagem. Ele pode não ser compatível com o JSNES.')}},7000);
  }catch(e){nes=null;showError(e.message||String(e))}
}
document.querySelector('#retry').addEventListener('click',()=>location.reload());
document.querySelector('#screenFrame').addEventListener('dblclick',()=>immersive());
boot();
</script>
