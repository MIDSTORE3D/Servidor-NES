<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Servidor-NES</title>
<style>
:root{color-scheme:dark;--accent:#d85969;--fg:#f4f5f8;--pad:clamp(110px,26vmin,160px);--action:clamp(48px,12vmin,68px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0e1016}
body{font:14px system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--fg);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;width:100vw;height:100dvh;background:radial-gradient(ellipse at center,#1c1e28 0%,#0b0c11 80%);display:grid;place-items:center;overflow:hidden}
#screen{width:min(95vw,calc(90dvh * 256 / 240));aspect-ratio:256/240;max-height:90dvh;position:relative;flex-shrink:0;background:#000;box-shadow:0 0 0 1px #383941,0 12px 46px #0008;border-radius:4px;overflow:hidden}
#screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
@media(min-aspect-ratio:1.45){#screen{width:min(60vw,calc(92dvh * 256 / 240));max-height:92dvh}}
@media(orientation:portrait){#screen{transform:translateY(-11dvh);width:min(98vw,calc(60dvh * 256 / 240));max-height:60dvh}}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;touch-action:none}
#dpad{position:absolute;left:max(12px,env(safe-area-inset-left),2vw);bottom:max(22px,env(safe-area-inset-bottom),4dvh);width:var(--pad);height:var(--pad);pointer-events:auto;touch-action:none;opacity:.88;cursor:pointer}
#dpad:before,#dpad:after{content:"";position:absolute;border:2px solid #bec3d063;background:#22252dcc}
#dpad:before{top:33.333%;left:0;width:100%;height:33.333%;border-radius:8px}
#dpad:after{left:33.333%;top:0;width:33.333%;height:100%;border-radius:8px}
#dpad .center{position:absolute;left:40%;top:40%;width:20%;height:20%;background:#363a47;border-radius:50%;z-index:1;pointer-events:none}
#dpad.pressed{opacity:1}
#actions{position:absolute;right:max(12px,env(safe-area-inset-right),2vw);bottom:max(37px,env(safe-area-inset-bottom),6dvh);display:flex;gap:clamp(8px,3vmin,18px);align-items:center;pointer-events:none;transform:rotate(-13deg)}
.action{width:var(--action);height:var(--action);border-radius:50%;border:2px solid #e4abb09a;background:#a92d4bbd;color:#fff;font-size:20px;font-weight:800;pointer-events:auto;touch-action:none;transform:rotate(13deg);cursor:pointer;opacity:.86}
.action.pressed{background:#e25373f2;opacity:1}
#actions .action:first-child{transform:translateY(14px) rotate(13deg)}
#actions .action:last-child{transform:translateY(-14px) rotate(13deg)}
#middle{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:13px;pointer-events:none}
.system{pointer-events:auto;touch-action:none;min-width:62px;height:27px;padding:0 9px;border:1px solid #bbc0d07f;border-radius:16px;background:#272a35d9;color:#e5e6eb;font-weight:700;font-size:10px;letter-spacing:.7px;cursor:pointer;opacity:.88}
.system.pressed{background:#586071;opacity:1}
@media(orientation:portrait){:root{--pad:clamp(115px,34vw,168px);--action:clamp(51px,15vw,68px)}#dpad{bottom:max(64px,env(safe-area-inset-bottom) + 54px)}#actions{bottom:max(84px,env(safe-area-inset-bottom) + 74px)}#middle{bottom:max(18px,env(safe-area-inset-bottom) + 10px)}}
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-content:center;text-align:center;padding:20px;background:#0b0c15ed;gap:12px}
#overlay[hidden]{display:none!important}
#overlay h1{font-size:18px;margin:0}
#overlay p{margin:0 auto;max-width:410px;color:#c1c4d0;line-height:1.45;overflow-wrap:anywhere}
#overlay button{margin:auto;padding:11px 16px;background:#e3e4ee;border:0;border-radius:9px;color:#14141d;font-weight:bold;cursor:pointer}
#retry[hidden]{display:none!important}
#soundLabel{position:fixed;right:10px;top:8px;z-index:4;background:#161922ca;border:1px solid #747a8b55;border-radius:9px;color:#f3f4f8;font-size:11px;padding:6px 8px;pointer-events:auto;cursor:pointer}
#soundLabel[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<!-- NES core: JSNES 2.1.0, Apache-2.0 (https://github.com/bfirsh/jsnes). -->
</head>
<body>
<main id="app" aria-label="Emulador Nintendo Entertainment System">
<div id="screen"><canvas id="view" width="256" height="240" aria-label="Jogo NES"></canvas></div>
<div id="hud" aria-label="Controles do NES">
  <div id="dpad" role="group" aria-label="Direcional" tabindex="-1"><div class="center"></div></div>
  <div id="actions"><button class="action" data-key="B" aria-label="Botão B">B</button><button class="action" data-key="A" aria-label="Botão A">A</button></div>
  <div id="middle"><button class="system" data-key="SELECT">SELECT</button><button class="system" data-key="START">START</button></div>
</div>
<div id="overlay" role="status" aria-live="polite"><h1>Servidor-NES</h1><p id="message">Preparando o emulador NES...</p><button id="retry" type="button" hidden>Recarregar</button></div>
<button id="soundLabel" type="button" hidden aria-label="Ativar som">Ativar som</button>
</main>
<script>
'use strict';
// Emula NES fora da thread dos toques; nenhuma dependência de EmulatorJS.
const $=q=>document.querySelector(q);
const args=new URLSearchParams(location.search);
const nameRule=/^[\p{L}\p{N}][\p{L}\p{N} ._-]{0,99}$/u;
let fileName='';
try{fileName=(()=>{
 let name=args.get('jogo')||'coleta-estrelas';
 if(/\.nes$/i.test(name))name=name.slice(0,-4);
 if(!nameRule.test(name)||/[. ]$/.test(name))throw Error('Nome de jogo inválido. Exemplo: ?jogo=SMB3');
 return name+'.nes';
})();}catch(err){fileName='';document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#message').textContent=err.message;document.querySelector('#retry').hidden=false;});}
const WORKER_SOURCE=String.raw`
'use strict';
let engine;
let running=false, timer=0, nextTime=0, frameOutstanding=false, sound=false;
let audioBuffer=new Float32Array(2048), audioIndex=0;
const buttons={A:0,B:1,SELECT:2,START:3,UP:4,DOWN:5,LEFT:6,RIGHT:7};
let loaded=false;
try{
  try{importScripts('https://cdn.jsdelivr.net/npm/jsnes@2.1.0/dist/jsnes.min.js');}
  catch(e){importScripts('https://unpkg.com/jsnes@2.1.0/dist/jsnes.min.js');}
  if(!self.jsnes||!self.jsnes.NES)throw Error('Biblioteca JSNES indisponível.');
  postMessage({type:'libraryReady'});
}catch(e){postMessage({type:'fatal',error:'Falha ao baixar o núcleo NES: '+(e.message||String(e))});}
function sendFrame(frame){
 if(frameOutstanding)return;
 const pixels=new Uint32Array(frame.length);
 pixels.set(frame);
 frameOutstanding=true;
 postMessage({type:'frame',pixels:pixels.buffer},[pixels.buffer]);
}
function sendSample(l,r){
 if(!sound)return;
 audioBuffer[audioIndex++]=l;
 audioBuffer[audioIndex++]=r;
 if(audioIndex>=audioBuffer.length){
  const ready=audioBuffer;
  audioBuffer=new Float32Array(2048);audioIndex=0;
  postMessage({type:'audio',samples:ready.buffer},[ready.buffer]);
 }
}
function step(){
 if(!running)return;
 let now=performance.now();
 if(now+0.7<nextTime){timer=setTimeout(step,Math.max(1,nextTime-now));return;}
 try{engine.frame();}catch(e){running=false;postMessage({type:'fatal',error:'Emulação interrompida: '+(e.message||e)});return;}
 if(now-nextTime>125)nextTime=now;
 nextTime+=1000/60;
 timer=setTimeout(step,Math.max(0,nextTime-performance.now()));
}
self.onmessage=ev=>{
 const x=ev.data;
 try{
  if(x.type==='init'){
   if(!self.jsnes||!self.jsnes.NES)throw Error('O núcleo NES não iniciou.');
   engine=new jsnes.NES({onFrame:sendFrame,onAudioSample:sendSample,emulateSound:true,sampleRate:32000});
   engine.loadROM(new Uint8Array(x.rom));
   loaded=true;nextTime=performance.now();running=true;
   postMessage({type:'running'});step();
  }else if(x.type==='input'&&loaded){
   const key=buttons[x.name];if(key===undefined)return;
   if(x.down)engine.buttonDown(1,key); else engine.buttonUp(1,key);
  }else if(x.type==='frameAck')frameOutstanding=false;
  else if(x.type==='audioOn')sound=true;
  else if(x.type==='audioOff'){sound=false;audioIndex=0;}
  else if(x.type==='pause'){
   running=!x.value;
   if(running&&loaded){nextTime=performance.now();clearTimeout(timer);step();}
   else clearTimeout(timer);
  }
 }catch(e){postMessage({type:'fatal',error:'Erro do núcleo NES: '+(e.message||String(e))});}
};
`;
const AUDIO_WORKLET=String.raw`
class NESOutput extends AudioWorkletProcessor{
 constructor(){super();this.queue=[];this.pos=0;this.port.onmessage=e=>{
  if(e.data==='clear'){this.queue=[];this.pos=0;return;}
  const buf=e.data;
  if(!(buf instanceof ArrayBuffer))return;
  if(this.queue.length>=6){this.queue.shift();this.pos=0;}
  this.queue.push(new Float32Array(buf));
 };}
 process(inputs,outputs){
  const l=outputs[0][0],r=outputs[0][1]||l;
  for(let i=0;i<l.length;i++){
   while(this.queue.length&&this.pos>=this.queue[0].length){this.queue.shift();this.pos=0;}
   if(this.queue.length){const q=this.queue[0];l[i]=q[this.pos++];r[i]=q[this.pos++];}
   else{l[i]=0;r[i]=0;}
  }
  return true;
 }
}
registerProcessor('nes-output',NESOutput);
`;
const canvas=$('#view'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
if(!ctx)throw Error('Canvas 2D não disponível neste navegador.');
const image=ctx.createImageData(256,240);
const pixels32=new Uint32Array(image.data.buffer);
let latestFrame=null,framePending=false,worker=null,gameReady=false,errored=false;
let audioCtx=null,audioNode=null,audioStarting=false,audioReady=false,audioUnavailable=false;
let retryTimer=null;
function message(s){$('#message').textContent=s;}
function fail(s){if(errored)return;errored=true;clearTimeout(retryTimer);$('#overlay').hidden=false;$('#retry').hidden=false;message(s);console.error('[Servidor-NES]',s);}
function drawFrame(){
 framePending=false;
 if(!latestFrame)return;
 const packed=new Uint32Array(latestFrame);latestFrame=null;
 // O JSNES retorna pixels em formato BGR; canvas32 espera ABGR em little-endian.
 for(let i=0;i<packed.length;i++)pixels32[i]=0xff000000|packed[i];
 ctx.putImageData(image,0,0);
 worker?.postMessage({type:'frameAck'});
}
function workerMessage(e){
 const m=e.data;
 if(m.type==='libraryReady'){message('Iniciando jogo...');}
 else if(m.type==='running'){
  gameReady=true;$('#overlay').hidden=true;document.title=fileName.slice(0,-4)+' · NES';
  clearTimeout(retryTimer);
 }else if(m.type==='frame'){
  latestFrame=m.pixels;
  if(!framePending){framePending=true;requestAnimationFrame(drawFrame);}
 }else if(m.type==='audio'){
  if(audioReady&&audioNode){audioNode.port.postMessage(m.samples,[m.samples]);}
 }else if(m.type==='fatal'){fail(m.error);}
}
async function boot(){
 try{
  if(!fileName)throw Error('Nome do cartucho inválido. Exemplo: ?jogo=SMB3');
  message('Buscando '+fileName+'...');
  const r=await fetch('./jogos/'+encodeURIComponent(fileName),{cache:'default'});
  if(!r.ok)throw Error('Arquivo não encontrado: jogos/'+fileName+' (HTTP '+r.status+').');
  const rom=await r.arrayBuffer();const h=new Uint8Array(rom,0,Math.min(4,rom.byteLength));
  if(h.length!==4||h[0]!==78||h[1]!==69||h[2]!==83||h[3]!==26)throw Error('O arquivo não é uma ROM .nes válida.');
  message('Preparando núcleo JSNES...');
  const blobUrl=URL.createObjectURL(new Blob([WORKER_SOURCE],{type:'text/javascript'}));
  worker=new Worker(blobUrl);
  // Só revoga o código do Worker depois que o navegador terminou de carregá-lo.
  worker.addEventListener('message',()=>URL.revokeObjectURL(blobUrl),{once:true});
  worker.addEventListener('error',()=>URL.revokeObjectURL(blobUrl),{once:true});
  worker.onmessage=workerMessage;
  worker.onerror=ev=>{fail('Não foi possível iniciar a emulação NES. '+(ev.message||''));};
  worker.postMessage({type:'init',rom},[rom]);
  retryTimer=setTimeout(()=>{if(!gameReady)fail('O emulador não respondeu. Confira o acesso às CDNs e recarregue.');},45000);
 }catch(e){fail(e.message||String(e));}
}
async function activateSound(){
 if(audioReady){if(audioCtx?.state==='suspended')await audioCtx.resume();return;}
 if(audioStarting||audioUnavailable||!gameReady)return;
 audioStarting=true;
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C||!window.AudioWorkletNode)throw Error('Web Audio indisponível.');
  audioCtx=new C({sampleRate:32000,latencyHint:'interactive'});
  // Inicia a autorização de áudio ainda dentro do gesto real do usuário.
  const resumePromise=audioCtx.resume();
  if(!audioCtx.audioWorklet)throw Error('AudioWorklet indisponível neste navegador.');
  const url=URL.createObjectURL(new Blob([AUDIO_WORKLET],{type:'text/javascript'}));
  try{await audioCtx.audioWorklet.addModule(url);}finally{URL.revokeObjectURL(url);}
  audioNode=new AudioWorkletNode(audioCtx,'nes-output',{outputChannelCount:[2]});
  audioNode.connect(audioCtx.destination);
  await resumePromise;audioReady=true;
  worker?.postMessage({type:'audioOn'});$('#soundLabel').hidden=true;
 }catch(e){audioUnavailable=true;console.warn('[Servidor-NES] Áudio indisponível:',e);$('#soundLabel').hidden=false;}
 finally{audioStarting=false;}
}
$('#soundLabel').addEventListener('click',()=>{audioUnavailable=false;void activateSound();});
// Botões independentes do motor de renderização, sem estilo/blur/filtros por toque.
const keyList=['UP','DOWN','LEFT','RIGHT','A','B','START','SELECT'];
const holders=new Map(keyList.map(k=>[k,new Set()]));
function keyState(key,source,down){
 if(!holders.has(key))return;
 const set=holders.get(key),prior=set.size>0;
 if(down)set.add(source);else set.delete(source);
 const active=set.size>0;
 if(prior!==active&&gameReady)worker?.postMessage({type:'input',name:key,down:active});
 if(key==='A'||key==='B'||key==='START'||key==='SELECT'){
  const el=document.querySelector('[data-key="'+key+'"]');el?.classList.toggle('pressed',active);
 }
}
const pad=$('#dpad'),padPointers=new Set();
function movePad(ev,source){
 const box=pad.getBoundingClientRect();
 const dx=(ev.clientX-box.left)/box.width-.5,dy=(ev.clientY-box.top)/box.height-.5;
 const dead=.16;
 const flags={UP:dy < -dead,DOWN:dy > dead,LEFT:dx < -dead,RIGHT:dx > dead};
 for(const [name,down] of Object.entries(flags))keyState(name,source,down);
}
pad.addEventListener('pointerdown',ev=>{
 ev.preventDefault();void activateSound();
 const source='p'+ev.pointerId;padPointers.add(source);pad.setPointerCapture(ev.pointerId);
 movePad(ev,source);pad.classList.add('pressed');
});
pad.addEventListener('pointermove',ev=>{const source='p'+ev.pointerId;if(padPointers.has(source)){ev.preventDefault();movePad(ev,source);}});
function releasePad(ev){const source='p'+ev.pointerId;if(!padPointers.delete(source))return;
 for(const k of ['UP','DOWN','LEFT','RIGHT'])keyState(k,source,false);
 if(padPointers.size===0)pad.classList.remove('pressed');
}
for(const evt of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(evt,releasePad);
for(const el of document.querySelectorAll('button[data-key]')){
 const k=el.dataset.key;
 el.addEventListener('pointerdown',ev=>{ev.preventDefault();void activateSound();el.setPointerCapture(ev.pointerId);keyState(k,'p'+ev.pointerId,true)});
 for(const evt of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(evt,ev=>keyState(k,'p'+ev.pointerId,false));
 el.addEventListener('contextmenu',ev=>ev.preventDefault());
}
const keymap={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',KeyX:'A',KeyZ:'B',KeyJ:'A',KeyK:'B',Enter:'START',ShiftRight:'SELECT',ShiftLeft:'SELECT'};
document.addEventListener('keydown',ev=>{const k=keymap[ev.code];if(!k)return;ev.preventDefault();if(ev.repeat)return;void activateSound();keyState(k,'keyboard',true);});
document.addEventListener('keyup',ev=>{const k=keymap[ev.code];if(!k)return;ev.preventDefault();keyState(k,'keyboard',false);});
function releaseAll(){for(const [key,states] of holders)for(const source of [...states])keyState(key,source,false);}
window.addEventListener('blur',releaseAll);
// Controle Bluetooth/USB: só consulta a cada frame enquanto houver gamepad conectado.
let padFrame=0,prevGp={};
function pollGamepad(){
 padFrame=0;
 if(document.hidden)return;
 const gp=navigator.getGamepads?.().find(x=>x?.connected);
 if(!gp){for(const [k,v] of Object.entries(prevGp))if(v)keyState(k,'gp',false);prevGp={};return;}
 const b=i=>!!gp.buttons[i]?.pressed,x=gp.axes[0]||0,y=gp.axes[1]||0;
 const now={UP:b(12)||y<-.5,DOWN:b(13)||y>.5,LEFT:b(14)||x<-.5,RIGHT:b(15)||x>.5,A:b(0),B:b(1),START:b(9),SELECT:b(8)};
 for(const [k,v] of Object.entries(now))if(v!==!!prevGp[k])keyState(k,'gp',v);
 prevGp=now;padFrame=requestAnimationFrame(pollGamepad);
}
window.addEventListener('gamepadconnected',()=>{if(!padFrame)padFrame=requestAnimationFrame(pollGamepad);});
window.addEventListener('gamepaddisconnected',()=>{if(!padFrame)padFrame=requestAnimationFrame(pollGamepad);});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){releaseAll();worker?.postMessage({type:'pause',value:true});if(padFrame){cancelAnimationFrame(padFrame);padFrame=0;}}
 else{worker?.postMessage({type:'pause',value:false});if(navigator.getGamepads?.().some(x=>x?.connected)&&!padFrame)padFrame=requestAnimationFrame(pollGamepad);}
});
// Chrome Android exige gesto do usuário: entra em fullscreen/landscape no primeiro toque.
let entering=false;
document.addEventListener('pointerup',async ev=>{
 if(ev.pointerType!=='touch'||!gameReady||entering||document.fullscreenElement||matchMedia('(display-mode:fullscreen)').matches)return;
 entering=true;
 try{await document.documentElement.requestFullscreen({navigationUI:'hide'});
  try{await screen.orientation.lock('landscape');}catch(e){}
 }catch(e){}finally{entering=false;}
},{capture:true,passive:true});
$('#retry').addEventListener('click',()=>location.reload());
boot();
</script>
</body>
</html>
